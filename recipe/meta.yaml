{% set name = "django-celery" %}
{% set version = "3.3.1" %}


package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/celery/django-celery/archive/{{ version }}.tar.gz
  sha256: 777220f032f0e12072bf457d5350b1318f5b8774e9cc6cc0ee645feb72d194bb

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - celery >=3.1.15,<4.0
  run:
    - python >={{ python_min }}
    - celery >=3.1.15,<4.0

test:
  imports:
    - djcelery
    - djcelery.backends
    - djcelery.contrib
    - djcelery.management
    - djcelery.management.commands
    - djcelery.migrations
    - djcelery.monproj
    - djcelery.tests
    - djcelery.tests.test_backends
  requires:
    - django >=1.8,<2.0
    - python {{ python_min }}

about:
  home: http://celeryproject.org
  license: BSD-2-Clause
  license_file: LICENSE
  license_family: BSD
  summary: Old django celery integration project.

extra:
  recipe-maintainers:
    - kwilcox
